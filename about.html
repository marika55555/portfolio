<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
 <style>
    body, html {
      height: 100%;
      font-family: 'Zen Antique', sans-serif; 
      overflow-x: hidden;
    }
.intro-text {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  color: rgb(0, 0, 0);
  font-size: 9px;
  opacity: 0;
  transition: opacity 1s ease;
  text-align: center;
  max-width: 90%;
  z-index: 2;
  background-color: rgba(255, 255, 255, 0)
  }
 .intro-text.visible {
   opacity: 1;
  }   

.header {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 1rem 2rem;
  background-color: transparent;
  z-index: 1000;
}
.logo img {
  height: 40px;
  width: auto;
}
.hamburger {
  position: fixed;
  top: 1rem;
  right: 1rem;
  z-index: 1001;
  cursor: pointer;
}
.hamburger img {
  width: 40px;
  height: auto;
}
.nav-menu {
  position: fixed;
  top: 0;
  right: -100%; 
  width: 100%;
  height: 100vh;
  background-color: rgba(154, 141, 22, 0.95);
  display: flex;
  justify-content: center;
  align-items: center;
  transition: right 0.3s ease;
  z-index: 1000;
  }
.nav-menu.active {
right: 0;
}
.nav-menu ul {
list-style: none;
padding: 0;
margin: 0;
text-align: center;
}
.nav-menu li {
margin: 1.5rem 0;
}
.nav-menu li img {
width: 120px;
height: auto;
}

   .video-container {
   position: fixed;
   top: 0;
   left: 0;
   width: 100%;
   height: 100%;
   overflow: hidden;
   z-index: -1;
   }
   .video-container video {
   width: 11%;
   height: 100%;
   object-fit: cover;
   }
   .overlay {
   position: absolute;
   top: 0;
   left: 0;
   width: 100%;
   height: 100%;
   background-color: rgba(164, 144, 54, 0.267);
   z-index: 1;
   }
</style>
</head>

<body>
  <div class="video-container">
    <video autoplay muted loop playsinline>
    <source src="me.mp4" type="video/mp4">
    </video>
 </div>
  <div class="overlay"></div>
 <div class="intro-text" id="introText">
  <h1>About me</h1>
1999年 宮城県生まれ。<br>
幼少期から絵を描くこと、<br>
デザインすることを続けていました。<br>
東北生活文化大学高等学校 美術・デザイン科を卒業後、<br>
IT商材営業職➢百貨店美容部員➢リゾートホテル勤務を経て<br>
「傾聴力・ホスピタリティを活かした体験価値の提供」を信念に<br>
顧客満足の追及をしてきました。<br>
<br>
デザイン領域でも「相手に伝わる」
「見て楽しい」を目指し、<br>
パーソナルで心に残るデザインを日々模索しています。<br>
 </div>

<header class="header">
 <div class="logo">
  <a href="index.html">
  <img src="shiro.png" alt="My Logo">
  </a>
 </div>
 <div class="hamburger" id="hamburger">
 <img src="hannbaga.png" alt="Menu" />
 </div>
 <nav class="nav-menu" id="navMenu">
  <ul>
  <li><a href="index.html"><img src="home.png"></a></li>
  <li><a href="about.html"><img src="about.png"></a></li>
  <li><a href="portfolio.html"><img src="portfolio.png"></a></li>
  <li><a href="history.html"><img src="history.png"></a></li>
  </ul>
 </nav>
</header>
<script>
   const hamburger = document.getElementById('hamburger');
   const navMenu = document.getElementById('navMenu');
   hamburger.addEventListener('click', () => {
   navMenu.classList.toggle('active');
   });
   window.addEventListener('scroll', () => {
   navMenu.classList.remove('active');
   });
   document.addEventListener('click', (e) => {
   if (!navMenu.contains(e.target) && !hamburger.contains(e.target)) {
   navMenu.classList.remove('active');
   }
   });
  window.addEventListener('load', () => {
  setTimeout(() => {
  const intro = document.getElementById('introText');
  intro.classList.add('visible');
  }, 1000);
  });
 </script>
</body>
</html>
