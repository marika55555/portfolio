<!DOCTYPE html>
<html lang="ja">
<head>
  <link href="https://fonts.googleapis.com/css2?family=Zen+Antique&display=swap" rel="stylesheet">
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>渡邊真梨佳WEBsite</title>
<style>
    .video-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      z-index: -1;
    }
    .video-container video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .header {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1rem 2rem;
      background-color: transparent;
      z-index: 1000;
    }
    .logo img {
      height: 40px;
      width: auto;
    }
    .hamburger {
      position: fixed;
      top: 1rem;
      right: 1rem;
      z-index: 1001;
      cursor: pointer;
    }
    .hamburger img {
      width: 40px;
      height: auto;
    }
    .nav-menu {
      position: fixed;
      top: 0;
      right: -100%;
      width: 100%;
      height: 100vh;
      background-color: rgba(255, 10, 116, 0.95);
      display: flex;
      justify-content: center;
      align-items: center;
      transition: right 0.3s ease;
      z-index: 1000;
    }
    .nav-menu.active {
      right: 0;
    }
    .nav-menu ul {
      list-style: none;
      padding: 0;
      margin: 0;
      text-align: center;
    }
    .nav-menu li {
      margin: 1.5rem 0;
    }
    .nav-menu li img {
      width: 120px;
      height: auto;
    }
  </style>
</head>

<body>
  <div class="video-container">
    <video autoplay muted loop playsinline>
    <source src="your-video.mp4" type="video/mp4">
    </video>
  </div>
　　<header class="header">
    <div class="logo">
      <a href="index.html">
      <img src="shiro.png">
      </a>
    </div>
    <div class="hamburger" id="hamburger">
      <img src="hannbaga.png"/>
    </div>
　　<nav class="nav-menu" id="navMenu">
      <ul>
        <li><a href="index.html"><img src="home.png"></a></li>
        <li><a href="about.html"><img src="about.png"></a></li>
        <li><a href="portfolio.html"><img src="portfolio.png"></a></li>
        <li><a href="history.html"><img src="history.png"></a></li>
      </ul>
    </nav>
  </header>
　<script>
    const hamburger = document.getElementById('hamburger');
    const navMenu = document.getElementById('navMenu');
    hamburger.addEventListener('click', () => {
      navMenu.classList.toggle('active');
    });
    window.addEventListener('scroll', () => {
      navMenu.classList.remove('active');
    });
    document.addEventListener('click', (e) => {
      if (!navMenu.contains(e.target) && !hamburger.contains(e.target)) {
        navMenu.classList.remove('active');
      }
    });
  </script>
</body>
</html>
